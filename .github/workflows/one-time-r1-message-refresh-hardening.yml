name: One-time R1 Message Freshness Hardening

on:
  push:
    branches:
      - feat/r1-position-freshness

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gfa_r1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gfa_r1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gfa_r1_test?sslmode=disable
    steps:
      - name: Checkout R1 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/r1-position-freshness
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Apply monotonic duplicate message refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/api/internal/repository/postgres/flightstate_write.go')
          text = path.read_text()
          before = """const insertFlightStateQuery = `
"""
          if text.count(before) != 1:
              raise SystemExit('insert query anchor missing')

          query_end = """\tON CONFLICT (source_name, icao24, observed_at)
\tDO NOTHING;
`
"""
          replacement = query_end + """
const refreshFlightStateMessageObservationQuery = `
\tUPDATE flight_states
\tSET message_observed_at = $4
\tWHERE source_name = $1
\t\tAND icao24 = $2
\t\tAND observed_at = $3
\t\tAND $4::timestamptz IS NOT NULL
\t\tAND (
\t\t\tmessage_observed_at IS NULL
\t\t\tOR message_observed_at < $4
\t\t);
`
"""
          if text.count(query_end) != 1:
              raise SystemExit('insert query ending missing')
          text = text.replace(query_end, replacement)

          old_save = """\t\tinsertedCount += int(commandTag.RowsAffected())
\t}

\treturn insertedCount, nil
}
"""
          new_save = """\t\tinserted := int(commandTag.RowsAffected())
\t\tif inserted == 0 && item.MessageObservedAt != nil {
\t\t\t_, err = tx.Exec(
\t\t\t\tctx,
\t\t\t\trefreshFlightStateMessageObservationQuery,
\t\t\t\trequiredSourceNameValue(item.SourceName),
\t\t\t\titem.ICAO24,
\t\t\t\titem.ObservedAt,
\t\t\t\titem.MessageObservedAt,
\t\t\t)
\t\t\tif err != nil {
\t\t\t\treturn 0, fmt.Errorf(
\t\t\t\t\t\"refresh flight state message observation at index %d for icao24 %s: %w\",
\t\t\t\t\tindex,
\t\t\t\t\titem.ICAO24,
\t\t\t\t\terr,
\t\t\t\t)
\t\t\t}
\t\t}

\t\tinsertedCount += inserted
\t}

\treturn insertedCount, nil
}
"""
          if text.count(old_save) != 1:
              raise SystemExit('save-count anchor missing')
          path.write_text(text.replace(old_save, new_save))

          migration = Path('database/migrations/030_add_flight_state_message_observation_time.sql')
          migration_text = migration.read_text()
          old_comment = "    'Optional time of the latest provider message/contact; may be newer than the position observation and must not replace position freshness.';"
          new_comment = "    'Optional latest provider message/contact time for this source, aircraft, and position identity; replay conflicts may monotonically refresh it without creating a new position state.';"
          if migration_text.count(old_comment) != 1:
              raise SystemExit('migration comment anchor missing')
          migration.write_text(migration_text.replace(old_comment, new_comment))

          doc = Path('docs/216_READSB_POSITION_FRESHNESS.md')
          doc_text = doc.read_text()
          old_persistence = "Migration `030_add_flight_state_message_observation_time.sql` adds nullable `flight_states.message_observed_at`. Existing `flight_states.observed_at` remains the position timestamp used by current traffic, trajectories, replay, projection inputs and position-based analytics."
          new_persistence = old_persistence + " Duplicate replay identities remain a single position state: if the same `(source_name, icao24, observed_at)` is observed again with a newer non-null message timestamp, persistence monotonically refreshes only `message_observed_at`; the duplicate is not counted as a newly inserted flight state, and older or missing message evidence cannot move the timestamp backward or erase it."
          if doc_text.count(old_persistence) != 1:
              raise SystemExit('documentation persistence anchor missing')
          doc.write_text(doc_text.replace(old_persistence, new_persistence))
          PY

          cat > apps/api/internal/repository/postgres/flightstate_message_observation_refresh_integration_test.go <<'GO'
          package postgres

          import (
          	"context"
          	"testing"
          	"time"

          	"github.com/AsifAbbasov/global-flight-analytics/apps/api/internal/domain/flightstate"
          )

          func TestFlightStateDuplicatePositionRefreshesOnlyNewerMessageObservation(t *testing.T) {
          	fixture := newReconciliationFixture(t)
          	defer fixture.close(t)
          	ctx := context.Background()

          	_, err := fixture.pool.Exec(ctx, `
          		CREATE TABLE flight_states (
          			id bigserial PRIMARY KEY,
          			flight_id uuid,
          			aircraft_id uuid,
          			icao24 text NOT NULL,
          			callsign text,
          			latitude numeric NOT NULL,
          			longitude numeric NOT NULL,
          			barometric_altitude_m integer,
          			barometric_altitude_status text NOT NULL,
          			geometric_altitude_m integer,
          			geometric_altitude_status text NOT NULL,
          			velocity_mps numeric,
          			heading_degrees numeric,
          			vertical_rate_mps numeric,
          			on_ground boolean,
          			origin_country text,
          			squawk_code text,
          			special_purpose_indicator boolean NOT NULL,
          			position_source text NOT NULL,
          			aircraft_category smallint,
          			aircraft_category_available boolean NOT NULL,
          			observed_at timestamptz NOT NULL,
          			message_observed_at timestamptz,
          			source_name text NOT NULL,
          			ingestion_run_id uuid,
          			UNIQUE (source_name, icao24, observed_at)
          		);
          	`)
          	if err != nil {
          		t.Fatalf("create flight_states fixture: %v", err)
          	}

          	positionAt := time.Date(2026, time.September, 9, 12, 0, 0, 0, time.UTC)
          	firstMessageAt := positionAt.Add(2 * time.Second)
          	newerMessageAt := positionAt.Add(11 * time.Second)
          	olderMessageAt := positionAt.Add(7 * time.Second)

          	state := flightstate.FlightState{
          		ICAO24:                    "ABC123",
          		Latitude:                  40.4093,
          		Longitude:                 49.8671,
          		BarometricAltitudeStatus:  flightstate.AltitudeStatusUnavailable,
          		GeometricAltitudeStatus:   flightstate.AltitudeStatusUnavailable,
          		PositionSource:            flightstate.PositionSourceADSB,
          		ObservedAt:                positionAt,
          		MessageObservedAt:         &firstMessageAt,
          		SourceName:                "test-readsb",
          		TelemetryAvailabilityKnown: true,
          	}

          	if inserted := saveFlightStateBatchForTest(t, ctx, fixture, state); inserted != 1 {
          		t.Fatalf("first inserted count = %d, want 1", inserted)
          	}
          	assertPersistedMessageObservation(t, ctx, fixture, firstMessageAt, 1)

          	state.MessageObservedAt = &newerMessageAt
          	if inserted := saveFlightStateBatchForTest(t, ctx, fixture, state); inserted != 0 {
          		t.Fatalf("newer duplicate inserted count = %d, want 0", inserted)
          	}
          	assertPersistedMessageObservation(t, ctx, fixture, newerMessageAt, 1)

          	state.MessageObservedAt = &olderMessageAt
          	if inserted := saveFlightStateBatchForTest(t, ctx, fixture, state); inserted != 0 {
          		t.Fatalf("older duplicate inserted count = %d, want 0", inserted)
          	}
          	assertPersistedMessageObservation(t, ctx, fixture, newerMessageAt, 1)

          	state.MessageObservedAt = nil
          	if inserted := saveFlightStateBatchForTest(t, ctx, fixture, state); inserted != 0 {
          		t.Fatalf("nil duplicate inserted count = %d, want 0", inserted)
          	}
          	assertPersistedMessageObservation(t, ctx, fixture, newerMessageAt, 1)
          }

          func saveFlightStateBatchForTest(
          	t *testing.T,
          	ctx context.Context,
          	fixture *reconciliationFixture,
          	state flightstate.FlightState,
          ) int {
          	t.Helper()
          	tx, err := fixture.pool.Begin(ctx)
          	if err != nil {
          		t.Fatalf("begin flight state transaction: %v", err)
          	}
          	defer func() { _ = tx.Rollback(ctx) }()

          	inserted, err := saveFlightStateBatch(ctx, tx, []flightstate.FlightState{state})
          	if err != nil {
          		t.Fatalf("save flight state batch: %v", err)
          	}
          	if err := tx.Commit(ctx); err != nil {
          		t.Fatalf("commit flight state transaction: %v", err)
          	}
          	return inserted
          }

          func assertPersistedMessageObservation(
          	t *testing.T,
          	ctx context.Context,
          	fixture *reconciliationFixture,
          	want time.Time,
          	wantRows int,
          ) {
          	t.Helper()
          	var got time.Time
          	var rows int
          	err := fixture.pool.QueryRow(ctx, `
          		SELECT message_observed_at, COUNT(*) OVER ()
          		FROM flight_states
          		WHERE source_name = 'test-readsb'
          			AND icao24 = 'ABC123';
          	`).Scan(&got, &rows)
          	if err != nil {
          		t.Fatalf("load persisted message observation: %v", err)
          	}
          	if !got.Equal(want) {
          		t.Fatalf("message_observed_at = %s, want %s", got, want)
          	}
          	if rows != wantRows {
          		t.Fatalf("flight state row count = %d, want %d", rows, wantRows)
          	}
          }
          GO

          gofmt -w \
            apps/api/internal/repository/postgres/flightstate_write.go \
            apps/api/internal/repository/postgres/flightstate_message_observation_refresh_integration_test.go
          git diff --check

      - name: Run focused PostgreSQL regression
        shell: bash
        run: |
          set -euo pipefail
          cd apps/api
          go test ./internal/repository/postgres -run '^TestFlightStateDuplicatePositionRefreshesOnlyNewerMessageObservation$' -count=1

      - name: Run backend regression suite
        shell: bash
        env:
          TEST_DATABASE_URL: ""
        run: |
          set -euo pipefail
          cd apps/api
          go test ./...
          go run ./tools/stage14finalaudit -strict

      - name: Commit validated persistence hardening
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-r1-message-refresh-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve latest message freshness on replay"
          git push origin HEAD:feat/r1-position-freshness
