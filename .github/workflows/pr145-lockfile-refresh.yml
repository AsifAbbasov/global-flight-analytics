name: PR 145 Lockfile Refresh

on:
  push:
    branches:
      - ops/reduce-production-ingestion-cadence
    paths:
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pr145-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: Generate and commit lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ops/reduce-production-ingestion-cadence

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.9.0'

      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify patched dependency audit
        run: pnpm audit --prod --audit-level moderate

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'LOCKFILE_REFRESH=UNCHANGED'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'security: refresh browserslist lockfile'
          git push origin HEAD:ops/reduce-production-ingestion-cadence
