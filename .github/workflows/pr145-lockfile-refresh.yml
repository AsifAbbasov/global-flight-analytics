name: PR 145 Lockfile Refresh

on:
  push:
    branches:
      - ops/reduce-production-ingestion-cadence
    paths:
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pr145-lockfile-refresh.yml'

permissions:
  contents: read

jobs:
  generate-lockfile:
    name: Generate lockfile artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.9.0'

      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify patched dependency audit
        run: pnpm audit --prod --audit-level moderate

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr145-generated-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
