name: Playwright E2E

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - 'scripts/run-playwright-e2e.sh'
      - 'scripts/verify-playwright-e2e.mjs'
      - 'scripts/verify-playwright-e2e.test.mjs'
      - 'docs/176_PLAYWRIGHT_E2E_FOUNDATION.md'
      - 'docs/DOCUMENT_INDEX.md'
      - 'package.json'
      - 'scripts/verify-release.sh'
      - '.gitignore'
      - '.github/workflows/playwright-e2e.yml'

  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'openapi/**'
      - 'scripts/run-playwright-e2e.sh'
      - 'scripts/verify-playwright-e2e.mjs'
      - 'scripts/verify-playwright-e2e.test.mjs'
      - 'docs/176_PLAYWRIGHT_E2E_FOUNDATION.md'
      - 'docs/DOCUMENT_INDEX.md'
      - 'package.json'
      - 'scripts/verify-release.sh'
      - '.gitignore'
      - '.github/workflows/playwright-e2e.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PLAYWRIGHT_VERSION: '1.62.0'
      PLAYWRIGHT_INSTALL_WITH_DEPS: '1'
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8091
      PLAYWRIGHT_APP_ORIGIN: http://127.0.0.1:3000
      PLAYWRIGHT_API_ORIGIN: http://127.0.0.1:8091

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.9.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Playwright foundation contract
        run: |
          node --test scripts/verify-playwright-e2e.test.mjs
          node scripts/verify-playwright-e2e.mjs
          bash -n scripts/run-playwright-e2e.sh

      - name: Run Chromium end-to-end suite
        run: bash scripts/run-playwright-e2e.sh

      - name: Upload Playwright evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
          if-no-files-found: warn
          retention-days: 14

# PLAYWRIGHT-E2E-FOUNDATION-V1
