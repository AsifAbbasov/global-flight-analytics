name: One-time R1 Position Freshness Backend

on:
  push:
    branches:
      - feat/r1-position-freshness

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/r1-position-freshness
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Apply bounded backend freshness changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replaceExact(path, before, after, expected = 1) {
            const input = fs.readFileSync(path, 'utf8')
            const count = input.split(before).length - 1
            if (count !== expected) {
              throw new Error(`${path}: expected ${expected} occurrence(s), found ${count}`)
            }
            fs.writeFileSync(path, input.replace(before, after))
          }

          replaceExact(
            'apps/api/internal/domain/flightstate/model.go',
            '\tObservedAt                 time.Time\n\tSourceName                 string',
            '\tObservedAt                 time.Time\n\tMessageObservedAt          *time.Time\n\tSourceName                 string'
          )

          replaceExact(
            'apps/api/internal/integrations/readsbcompat/models.go',
            '\tSeen         OptionalFloat64    `json:"seen"`\n\tType         string',
            '\tSeen         OptionalFloat64    `json:"seen"`\n\tSeenPos      OptionalFloat64    `json:"seen_pos"`\n\tType         string'
          )

          replaceExact(
            'apps/api/internal/integrations/readsbcompat/mapper.go',
            'func MapAircraft(\n',
            `func OptionalObservationTime(\n\tsnapshotAt time.Time,\n\tseen OptionalFloat64,\n) *time.Time {\n\tif snapshotAt.IsZero() {\n\t\treturn nil\n\t}\n\tage, ok := SafeSeenDuration(seen)\n\tif !ok {\n\t\treturn nil\n\t}\n\tvalue := snapshotAt.UTC().Add(-age).UTC()\n\treturn &value\n}\n\nfunc MapAircraft(\n`
          )

          replaceExact(
            'apps/api/internal/integrations/readsbcompat/mapper.go',
            '\tonGroundAvailable := barometricAltitude.Status == flightstate.AltitudeStatusGround ||\n\t\tbarometricAltitude.Status == flightstate.AltitudeStatusObserved\n\n\treturn flightstate.FlightState{',
            `\tonGroundAvailable := barometricAltitude.Status == flightstate.AltitudeStatusGround ||\n\t\tbarometricAltitude.Status == flightstate.AltitudeStatusObserved\n\n\tpositionObservedAt := OptionalObservationTime(snapshotAt, item.SeenPos)\n\tif positionObservedAt == nil {\n\t\tpositionObservedAt = OptionalObservationTime(snapshotAt, item.Seen)\n\t}\n\tobservedAt := snapshotAt.UTC()\n\tif positionObservedAt != nil {\n\t\tobservedAt = *positionObservedAt\n\t}\n\tmessageObservedAt := OptionalObservationTime(snapshotAt, item.Seen)\n\n\treturn flightstate.FlightState{`
          )

          replaceExact(
            'apps/api/internal/integrations/readsbcompat/mapper.go',
            '\t\tObservedAt:                 ObservationTime(snapshotAt, item.Seen),\n\t\tSourceName:',
            '\t\tObservedAt:                 observedAt,\n\t\tMessageObservedAt:          messageObservedAt,\n\t\tSourceName:'
          )

          replaceExact(
            'apps/api/internal/integrations/opensky/provider.go',
            '\tmapped := flightstate.FlightState{',
            '\tmessageObservedAt := state.LastContact.UTC()\n\n\tmapped := flightstate.FlightState{'
          )

          replaceExact(
            'apps/api/internal/integrations/opensky/provider.go',
            '\t\tObservedAt:                 state.TimePosition.UTC(),\n\t\tSourceName:',
            '\t\tObservedAt:                 state.TimePosition.UTC(),\n\t\tMessageObservedAt:          &messageObservedAt,\n\t\tSourceName:'
          )

          replaceExact(
            'apps/api/internal/repository/postgres/flightstate_write.go',
            '\t\tobserved_at,\n\t\tsource_name,',
            '\t\tobserved_at,\n\t\tmessage_observed_at,\n\t\tsource_name,'
          )

          replaceExact(
            'apps/api/internal/repository/postgres/flightstate_write.go',
            '\t\t$21,\n\t\t$22,\n\t\t$23\n',
            '\t\t$21,\n\t\t$22,\n\t\t$23,\n\t\t$24\n'
          )

          replaceExact(
            'apps/api/internal/repository/postgres/flightstate_write.go',
            '\t\titem.ObservedAt,\n\t\trequiredSourceNameValue(item.SourceName),',
            '\t\titem.ObservedAt,\n\t\titem.MessageObservedAt,\n\t\trequiredSourceNameValue(item.SourceName),'
          )

          replaceExact(
            'apps/api/internal/domain/traffic/model.go',
            '\tObservedAt     time.Time\n\tAircraftModel',
            '\tObservedAt     time.Time\n\tMessageObservedAt *time.Time\n\tAircraftModel'
          )

          for (const marker of [
            '\t\t\tfs.observed_at,\n\t\t\tCOALESCE(am.model, \'\'),',
          ]) {
            replaceExact(
              'apps/api/internal/repository/postgres/traffic_repository.go',
              marker,
              '\t\t\tfs.observed_at,\n\t\t\tfs.message_observed_at,\n\t\t\tCOALESCE(am.model, \'\'),',
              2
            )
          }

          replaceExact(
            'apps/api/internal/repository/postgres/traffic_repository.go',
            '\t\tvar barometricStatus string\n\n\t\tif err := rows.Scan(',
            '\t\tvar barometricStatus string\n\t\tvar messageObservedAt pgtype.Timestamptz\n\n\t\tif err := rows.Scan('
          )

          replaceExact(
            'apps/api/internal/repository/postgres/traffic_repository.go',
            '\t\t\t&item.ObservedAt,\n\t\t\t&item.AircraftModel,',
            '\t\t\t&item.ObservedAt,\n\t\t\t&messageObservedAt,\n\t\t\t&item.AircraftModel,'
          )

          replaceExact(
            'apps/api/internal/repository/postgres/traffic_repository.go',
            '\t\titem.AltitudeM,\n',
            `\t\tif messageObservedAt.Valid {\n\t\t\tvalue := messageObservedAt.Time.UTC()\n\t\t\titem.MessageObservedAt = &value\n\t\t}\n\n\t\titem.AltitudeM,\n`
          )

          replaceExact(
            'apps/api/internal/http/dto/traffic.go',
            '\tObservedAt     time.Time                  `json:"observed_at"`\n\tAircraftModel',
            '\tObservedAt         time.Time                  `json:"observed_at"`\n\tPositionObservedAt time.Time                  `json:"position_observed_at"`\n\tMessageObservedAt  *time.Time                 `json:"message_observed_at"`\n\tAircraftModel'
          )

          replaceExact(
            'apps/api/internal/http/handlers/traffic.go',
            '\t\t\tObservedAt:     item.ObservedAt,\n\t\t\tAircraftModel:',
            '\t\t\tObservedAt:         item.ObservedAt,\n\t\t\tPositionObservedAt: item.ObservedAt,\n\t\t\tMessageObservedAt:  item.MessageObservedAt,\n\t\t\tAircraftModel:'
          )

          replaceExact(
            'apps/api/internal/database/migrationfile/production_catalog_regression_test.go',
            '\t\t28: "028_harden_historical_read_snapshot.sql",\n\t\t29: "029_harden_historical_aggregate_integrity.sql",',
            '\t\t28: "028_harden_historical_read_snapshot.sql",\n\t\t29: "029_harden_historical_aggregate_integrity.sql",\n\t\t30: "030_add_flight_state_message_observation_time.sql",'
          )

          replaceExact(
            'apps/api/tools/stage14finalaudit/main.go',
            '\t\t"aircraft_category_available",\n\t}',
            '\t\t"aircraft_category_available",\n\t\t"message_observed_at",\n\t}'
          )

          for (const path of [
            'apps/api/internal/repository/postgres/flightstate_altitude_integration_test.go',
            'apps/api/internal/repository/postgres/flightstate_reconciliation_repository_integration_test.go',
            'apps/api/internal/repository/postgres/traffic_altitude_semantics_integration_test.go',
          ]) {
            replaceExact(
              path,
              '\t\t\t\taircraft_category_available boolean,\n\t\t\t\tobserved_at timestamptz NOT NULL,',
              '\t\t\t\taircraft_category_available boolean,\n\t\t\t\tobserved_at timestamptz NOT NULL,\n\t\t\t\tmessage_observed_at timestamptz,',
              1
            )
          }
          NODE

          cat > database/migrations/030_add_flight_state_message_observation_time.sql <<'SQL'
          BEGIN;

          ALTER TABLE flight_states
              ADD COLUMN message_observed_at timestamptz;

          COMMENT ON COLUMN flight_states.observed_at IS
              'Time of the position observation used by canonical traffic, trajectory, freshness, and analytics semantics.';

          COMMENT ON COLUMN flight_states.message_observed_at IS
              'Optional time of the latest provider message/contact; may be newer than the position observation and must not replace position freshness.';

          COMMIT;
          SQL

          cat > apps/api/internal/integrations/readsbcompat/position_freshness_test.go <<'GO'
          package readsbcompat

          import (
              "testing"
              "time"
          )

          func TestMapAircraftSeparatesPositionAndMessageObservationTimes(t *testing.T) {
              snapshotAt := time.Date(2026, time.September, 9, 12, 0, 0, 0, time.UTC)
              item := AircraftItem{
                  Hex:       "abc123",
                  Latitude:  40.4093,
                  Longitude: 49.8671,
                  Seen:      OptionalFloat64{Value: 0.5, Available: true},
                  SeenPos:   OptionalFloat64{Value: 18, Available: true},
              }

              mapped := MapAircraft("test-readsb", item, snapshotAt)

              expectedPosition := snapshotAt.Add(-18 * time.Second)
              if !mapped.ObservedAt.Equal(expectedPosition) {
                  t.Fatalf("position observed_at = %s, want %s", mapped.ObservedAt, expectedPosition)
              }
              if mapped.MessageObservedAt == nil {
                  t.Fatal("expected message observation time")
              }
              expectedMessage := snapshotAt.Add(-500 * time.Millisecond)
              if !mapped.MessageObservedAt.Equal(expectedMessage) {
                  t.Fatalf("message observed_at = %s, want %s", mapped.MessageObservedAt, expectedMessage)
              }
          }

          func TestMapAircraftFallsBackToMessageAgeWhenSeenPosUnavailable(t *testing.T) {
              snapshotAt := time.Date(2026, time.September, 9, 12, 0, 0, 0, time.UTC)
              item := AircraftItem{
                  Hex:       "abc123",
                  Latitude:  40.4093,
                  Longitude: 49.8671,
                  Seen:      OptionalFloat64{Value: 2, Available: true},
              }

              mapped := MapAircraft("test-readsb", item, snapshotAt)
              expected := snapshotAt.Add(-2 * time.Second)
              if !mapped.ObservedAt.Equal(expected) {
                  t.Fatalf("fallback observed_at = %s, want %s", mapped.ObservedAt, expected)
              }
              if mapped.MessageObservedAt == nil || !mapped.MessageObservedAt.Equal(expected) {
                  t.Fatalf("message observation fallback = %#v, want %s", mapped.MessageObservedAt, expected)
              }
          }

          func TestMapAircraftKeepsMessageTimeUnavailableWhenSeenMissing(t *testing.T) {
              snapshotAt := time.Date(2026, time.September, 9, 12, 0, 0, 0, time.UTC)
              item := AircraftItem{
                  Hex:       "abc123",
                  Latitude:  40.4093,
                  Longitude: 49.8671,
                  SeenPos:   OptionalFloat64{Value: 3, Available: true},
              }

              mapped := MapAircraft("test-readsb", item, snapshotAt)
              if mapped.MessageObservedAt != nil {
                  t.Fatalf("unexpected message observation time: %s", mapped.MessageObservedAt)
              }
              expectedPosition := snapshotAt.Add(-3 * time.Second)
              if !mapped.ObservedAt.Equal(expectedPosition) {
                  t.Fatalf("position observed_at = %s, want %s", mapped.ObservedAt, expectedPosition)
              }
          }
          GO

          cat > apps/api/internal/integrations/opensky/position_freshness_test.go <<'GO'
          package opensky

          import (
              "testing"
              "time"
          )

          func TestMapStateVectorPreservesPositionAndLastContactTimesSeparately(t *testing.T) {
              positionAt := time.Date(2026, time.September, 9, 12, 0, 0, 0, time.UTC)
              contactAt := positionAt.Add(7 * time.Second)
              latitude := 40.4093
              longitude := 49.8671

              mapped, usable, err := MapStateVector(StateVector{
                  ICAO24:       "abc123",
                  Latitude:     &latitude,
                  Longitude:    &longitude,
                  TimePosition: &positionAt,
                  LastContact:  contactAt,
              })
              if err != nil {
                  t.Fatalf("map state vector: %v", err)
              }
              if !usable {
                  t.Fatal("expected state vector to be usable")
              }
              if !mapped.ObservedAt.Equal(positionAt) {
                  t.Fatalf("position observed_at = %s, want %s", mapped.ObservedAt, positionAt)
              }
              if mapped.MessageObservedAt == nil || !mapped.MessageObservedAt.Equal(contactAt) {
                  t.Fatalf("message observed_at = %#v, want %s", mapped.MessageObservedAt, contactAt)
              }
          }
          GO

          cat > apps/api/internal/repository/postgres/message_observation_migration_contract_test.go <<'GO'
          package postgres

          import (
              "os"
              "path/filepath"
              "runtime"
              "strings"
              "testing"
          )

          func TestMessageObservationMigrationKeepsPositionTimeCanonical(t *testing.T) {
              _, currentFile, _, ok := runtime.Caller(0)
              if !ok {
                  t.Fatal("resolve current file")
              }
              path := filepath.Clean(filepath.Join(
                  filepath.Dir(currentFile),
                  "../../../../../database/migrations/030_add_flight_state_message_observation_time.sql",
              ))
              content, err := os.ReadFile(path)
              if err != nil {
                  t.Fatalf("read migration: %v", err)
              }
              text := string(content)
              for _, required := range []string{
                  "ADD COLUMN message_observed_at timestamptz",
                  "Time of the position observation",
                  "must not replace position freshness",
              } {
                  if !strings.Contains(text, required) {
                      t.Fatalf("migration missing %q", required)
                  }
              }
              if strings.Contains(text, "UPDATE flight_states") {
                  t.Fatal("migration must not fabricate historical message timestamps")
              }
          }
          GO

      - name: Format and test backend scope
        shell: bash
        run: |
          gofmt -w \
            apps/api/internal/domain/flightstate/model.go \
            apps/api/internal/integrations/readsbcompat/models.go \
            apps/api/internal/integrations/readsbcompat/mapper.go \
            apps/api/internal/integrations/readsbcompat/position_freshness_test.go \
            apps/api/internal/integrations/opensky/provider.go \
            apps/api/internal/integrations/opensky/position_freshness_test.go \
            apps/api/internal/repository/postgres/flightstate_write.go \
            apps/api/internal/repository/postgres/traffic_repository.go \
            apps/api/internal/repository/postgres/message_observation_migration_contract_test.go \
            apps/api/internal/domain/traffic/model.go \
            apps/api/internal/http/dto/traffic.go \
            apps/api/internal/http/handlers/traffic.go \
            apps/api/internal/database/migrationfile/production_catalog_regression_test.go \
            apps/api/tools/stage14finalaudit/main.go
          cd apps/api
          go test ./internal/integrations/readsbcompat ./internal/integrations/opensky ./internal/domain/flightstate ./internal/domain/traffic ./internal/http/dto ./internal/http/handlers ./internal/database/migrationfile ./internal/repository/postgres ./tools/stage14finalaudit

      - name: Commit generated backend slice and self-remove workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-r1-position-freshness-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: separate position and message freshness"
          git push origin HEAD:feat/r1-position-freshness
