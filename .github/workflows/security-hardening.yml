name: Security Hardening

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.0'
      GITLEAKS_LINUX_X64_SHA256: '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e'
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          binary_path="$RUNNER_TEMP/gitleaks"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"

          curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --retry 3 \
            --retry-all-errors \
            --output "$archive_path" \
            "$url"

          printf '%s  %s\n' \
            "$GITLEAKS_LINUX_X64_SHA256" \
            "$archive_path" |
            sha256sum --check --status

          tar -xzf "$archive_path" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$binary_path"
          "$binary_path" version

      - name: Prove Gitleaks detector is active
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT

          git -C "$probe_dir" init --quiet
          git -C "$probe_dir" config user.email 'hardening@example.invalid'
          git -C "$probe_dir" config user.name 'GFA Hardening'
          printf '%s%s%s\n' \
            'aws_access_key_id = "AKIA' \
            '7M6N5B4V3C2XQWER' \
            '"' \
            > "$probe_dir/probe.txt"
          git -C "$probe_dir" add probe.txt
          git -C "$probe_dir" commit --quiet --message 'synthetic secret detector probe'

          if "$RUNNER_TEMP/gitleaks" git --no-banner --redact "$probe_dir" >/dev/null 2>&1; then
            printf '%s\n' 'GITLEAKS_DETECTOR_SELF_TEST=FAIL' >&2
            exit 1
          fi

          printf '%s\n' 'GITLEAKS_DETECTOR_SELF_TEST=PASS'

      - name: Scan repository history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
          printf '%s\n' 'GITLEAKS_REPOSITORY_SCAN=PASS'

  source-sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYFT_VERSION: '1.51.1'
      SYFT_LINUX_AMD64_SHA256: '8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install checksum-pinned Syft
        shell: bash
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          binary_path="$RUNNER_TEMP/syft"
          url="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${archive}"

          curl \
            --fail \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --retry 3 \
            --retry-all-errors \
            --output "$archive_path" \
            "$url"

          printf '%s  %s\n' \
            "$SYFT_LINUX_AMD64_SHA256" \
            "$archive_path" |
            sha256sum --check --status

          tar -xzf "$archive_path" -C "$RUNNER_TEMP" syft
          chmod 0755 "$binary_path"
          "$binary_path" version

      - name: Generate CycloneDX SBOM with Syft
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/security
          "$RUNNER_TEMP/syft" \
            . \
            --output cyclonedx-json=artifacts/security/gfa-source-sbom.cdx.json

      - name: Verify SBOM output
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/security/gfa-source-sbom.cdx.json
          grep -q '"bomFormat"[[:space:]]*:[[:space:]]*"CycloneDX"' artifacts/security/gfa-source-sbom.cdx.json
          printf '%s\n' 'CYCLONEDX_SBOM=PASS'

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gfa-cyclonedx-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/security/gfa-source-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  fuzz:
    name: Go Fuzz Safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Fuzz trusted proxy client identity
        run: go test ./internal/security/clientidentity -run '^$' -fuzz '^FuzzPolicyResolveReturnsBoundedIPAddress$' -fuzztime=15s

      - name: Fuzz traffic state normalization
        run: go test ./internal/services/traffic/normalizer -run '^$' -fuzz '^FuzzNormalizeFlightStateIsDeterministic$' -fuzztime=15s

  postgres-backup-restore:
    name: PostgreSQL Backup Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_IMAGE: global-flight-analytics-api:security-hardening
      POSTGRES_IMAGE: postgres:16.14-alpine3.24
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify backup drill script syntax
        run: bash -n scripts/run-postgres-backup-restore-drill.sh

      - name: Build backend image
        shell: bash
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            --pull \
            --build-arg APP_VERSION="security-hardening-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --build-arg RENDER_GIT_COMMIT="$SOURCE_SHA" \
            --build-arg BUILD_DATE="$build_date" \
            --file apps/api/Dockerfile \
            --tag "$BACKEND_IMAGE" \
            .

      - name: Run disposable backup and restore drill
        run: bash scripts/run-postgres-backup-restore-drill.sh

      - name: Upload backup drill evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-backup-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/security/postgres-backup-restore/gfa-backup-restore-drill.dump.sha256
            artifacts/security/postgres-backup-restore/evidence.json
          if-no-files-found: error
          retention-days: 30

  security-hardening-gate:
    name: Security Hardening Gate
    if: ${{ always() }}
    needs:
      - secret-scan
      - source-sbom
      - fuzz
      - postgres-backup-restore
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify hardening jobs
        shell: bash
        run: |
          test "${{ needs.secret-scan.result }}" = "success"
          test "${{ needs.source-sbom.result }}" = "success"
          test "${{ needs.fuzz.result }}" = "success"
          test "${{ needs.postgres-backup-restore.result }}" = "success"
