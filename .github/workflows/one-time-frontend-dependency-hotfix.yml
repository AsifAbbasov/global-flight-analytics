name: One-time Frontend Dependency Hotfix

on:
  push:
    branches:
      - security/frontend-dependency-hotfix
    paths:
      - .github/workflows/one-time-frontend-dependency-hotfix.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.9.0

      - name: Update direct dependency and security policy pins
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const webPath = 'apps/web/package.json'
          const web = JSON.parse(fs.readFileSync(webPath, 'utf8'))
          web.dependencies['maplibre-gl'] = '^6.4.1'
          web.dependencies.next = '16.3.4'
          web.dependencies.sharp = '0.35.4'
          web.devDependencies['eslint-config-next'] = '16.3.4'
          fs.writeFileSync(webPath, `${JSON.stringify(web, null, 2)}\n`)

          const verifierPath = 'scripts/verify-frontend-dependency-security.mjs'
          let verifier = fs.readFileSync(verifierPath, 'utf8')
          const replacements = [
            ['export const MINIMUM_SAFE_SHARP_VERSION = "0.35.0";', 'export const MINIMUM_SAFE_SHARP_VERSION = "0.35.4";'],
            ['export const PINNED_SHARP_VERSION = "0.35.3";', 'export const PINNED_SHARP_VERSION = "0.35.4";'],
            ['export const MINIMUM_SAFE_NEXT_VERSION = "16.2.12";', 'export const MINIMUM_SAFE_NEXT_VERSION = "16.3.3";'],
            ['export const PINNED_NEXT_VERSION = "16.2.12";', 'export const PINNED_NEXT_VERSION = "16.3.4";'],
          ]
          for (const [from, to] of replacements) {
            if (!verifier.includes(from)) throw new Error(`missing verifier token: ${from}`)
            verifier = verifier.replace(from, to)
          }
          fs.writeFileSync(verifierPath, verifier)

          const testPath = 'scripts/verify-frontend-dependency-security.test.mjs'
          let tests = fs.readFileSync(testPath, 'utf8')
          tests = tests.replaceAll('16.2.12', '16.3.4')
          tests = tests.replaceAll('16\\.2\\.12', '16\\.3\\.4')
          tests = tests.replaceAll('0.35.3', '0.35.4')
          tests = tests.replaceAll('0\\.35\\.3', '0\\.35\\.4')
          tests = tests.replaceAll("sharp@<0.35.0", "sharp@<0.35.4")
          fs.writeFileSync(testPath, tests)

          const workspacePath = 'pnpm-workspace.yaml'
          let workspace = fs.readFileSync(workspacePath, 'utf8')
          const oldOverride = "  'sharp@<0.35.0': 0.35.3"
          const newOverride = "  'sharp@<0.35.4': 0.35.4"
          if (!workspace.includes(oldOverride)) throw new Error('missing sharp workspace override')
          workspace = workspace.replace(oldOverride, newOverride)
          fs.writeFileSync(workspacePath, workspace)
          NODE

      - name: Regenerate lockfile from patched dependency set
        shell: bash
        run: |
          corepack enable
          pnpm install --lockfile-only --config.minimumReleaseAge=0

      - name: Verify dependency security contracts
        shell: bash
        run: |
          node --test scripts/verify-frontend-dependency-security.test.mjs
          node scripts/verify-frontend-dependency-security.mjs
          pnpm audit --prod --audit-level moderate

      - name: Commit generated hotfix and remove generator
        shell: bash
        run: |
          git rm .github/workflows/one-time-frontend-dependency-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/verify-frontend-dependency-security.mjs scripts/verify-frontend-dependency-security.test.mjs
          git diff --cached --check
          git commit -m 'security: patch frontend dependency advisories'
          git push origin HEAD:security/frontend-dependency-hotfix
