name: Governance V8 Cross Platform Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: governance-v8-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  V7_ARTIFACT_ID: '8843448354'
  V8_INSTALLER_SHA256: '51fd1ed9135db7f28cd860c372e1d302762288da26ff4eda57338cd1adc4d078'

jobs:
  ubuntu-full-release:
    name: Ubuntu Exact Baseline Full Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.9.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Reconstruct exact v8 installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$V7_ARTIFACT_ID/zip" \
            --output /tmp/governance-v7.zip
          rm -rf /tmp/governance-v7
          mkdir -p /tmp/governance-v7
          unzip -q /tmp/governance-v7.zip -d /tmp/governance-v7
          cp /tmp/governance-v7/governance-package-validation-runner.mjs /tmp/governance-v8-installer.mjs
          patch /tmp/governance-v8-installer.mjs < validation/installer-v8.patch
          node --check /tmp/governance-v8-installer.mjs
          actual_sha="$(sha256sum /tmp/governance-v8-installer.mjs | awk '{print $1}')"
          test "$actual_sha" = "$V8_INSTALLER_SHA256"
          printf '%s\n' "V8_BYTE_IDENTITY=PASS sha=$actual_sha"

      - name: Validate complete exact baseline release
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: node /tmp/governance-v8-installer.mjs --validate-baseline-only

      - name: Upload exact validated v8 installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: exact-validated-governance-installer-v8
          path: /tmp/governance-v8-installer.mjs
          if-no-files-found: error
          retention-days: 1

  macos-contract-reproduction:
    name: macOS Exact Backend Operations Contract
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout exact repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.9.0'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/api/go.mod
          cache: false

      - name: Reconstruct exact v8 installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$V7_ARTIFACT_ID/zip" \
            --output /tmp/governance-v7.zip
          rm -rf /tmp/governance-v7
          mkdir -p /tmp/governance-v7
          unzip -q /tmp/governance-v7.zip -d /tmp/governance-v7
          cp /tmp/governance-v7/governance-package-validation-runner.mjs /tmp/governance-v8-installer.mjs
          patch /tmp/governance-v8-installer.mjs < validation/installer-v8.patch
          node --check /tmp/governance-v8-installer.mjs
          actual_sha="$(shasum -a 256 /tmp/governance-v8-installer.mjs | awk '{print $1}')"
          test "$actual_sha" = "$V8_INSTALLER_SHA256"
          printf '%s\n' "V8_MACOS_BYTE_IDENTITY=PASS sha=$actual_sha"

      - name: Reproduce and validate the failed macOS contract
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: node /tmp/governance-v8-installer.mjs --validate-macos-contract-only
