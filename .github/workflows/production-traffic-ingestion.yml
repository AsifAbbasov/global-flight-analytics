name: Production Traffic Ingestion

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: Origin of the bounded production ingestion request
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: production-traffic-ingestion
  cancel-in-progress: false

jobs:
  ingest-once:
    name: Production Ingestion Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_INGESTION_DATABASE_URL }}
      DATABASE_CONNECT_TIMEOUT: 10s
      TRAFFIC_PROVIDER: adsb.lol
      TRAFFIC_INGESTION_LATITUDE: '40.4093'
      TRAFFIC_INGESTION_LONGITUDE: '49.8671'
      TRAFFIC_INGESTION_RADIUS: '250'
      TRAFFIC_INGESTION_INTERVAL: 10s
      TRAFFIC_INGESTION_TERMINAL_TIMEOUT: 30s
      TRAFFIC_INGESTION_STALE_RUN_AFTER: 30m
      TRAFFIC_INGESTION_MAX_BACKOFF: 2m
      ADSBLOL_TIMEOUT: 15s
      TRAJECTORY_MAX_TIME_GAP: 90s
      TRAJECTORY_MAX_GROUND_SPEED_MPS: '420'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.9.0'

      - name: Publish dispatch provenance
        env:
          DISPATCH_SOURCE: ${{ github.event.inputs.dispatch_source || github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          case "$DISPATCH_SOURCE" in
            manual|schedule|cloudflare-primary|cloudflare-watchdog)
              ;;
            *)
              printf '%s\n' "Unsupported production ingestion dispatch source: $DISPATCH_SOURCE" >&2
              exit 1
              ;;
          esac

          printf 'PRODUCTION_INGESTION_DISPATCH_SOURCE=%s\n' "$DISPATCH_SOURCE"

      - name: Validate ADSB.lol production contact gate
        env:
          ADSBLOL_PRODUCTION_CONTACT_CONFIRMED: ${{ vars.ADSBLOL_PRODUCTION_CONTACT_CONFIRMED }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$ADSBLOL_PRODUCTION_CONTACT_CONFIRMED" != "true" ]; then
            printf '%s\n' 'ADSBLOL_PRODUCTION_CONTACT_CONFIRMED must be true before production traffic ingestion can run' >&2
            exit 1
          fi

          printf '%s\n' 'ADSBLOL_PRODUCTION_CONTACT_GATE=PASS'


      - name: Validate production ingestion secret
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            printf '%s\n' 'PRODUCTION_INGESTION_DATABASE_URL is not configured' >&2
            exit 1
          fi

          printf '%s\n' 'PRODUCTION_INGESTION_SECRET=PASS'

      - name: Download dependencies
        run: go mod download

      - name: Run one bounded production ingestion cycle
        run: go run ./cmd/ingest --once

      - name: Verify end-to-end production traffic freshness
        env:
          API_BASE_URL: https://global-flight-analytics-api.onrender.com
          MAX_TRAFFIC_AGE_SECONDS: '1800'
        run: node ../../scripts/verify-production-traffic-freshness.mjs
