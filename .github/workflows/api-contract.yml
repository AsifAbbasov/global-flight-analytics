name: OpenAPI Contract

on:
  pull_request:
    paths:
      - 'apps/api/internal/http/**'
      - 'apps/api/internal/server/**'
      - 'openapi/**'
      - 'scripts/verify-openapi-contract.mjs'
      - 'scripts/verify-openapi-contract.test.mjs'
      - 'scripts/verify-openapi-route-inventory.mjs'
      - 'scripts/verify-openapi-route-inventory.test.mjs'
      - 'docs/175_OPENAPI_CONTRACT_FOUNDATION.md'
      - 'docs/177_OPENAPI_CONTRACT_CLOSURE_INVENTORY.md'
      - 'docs/178_OPENAPI_CORE_READ_SURFACE.md'
      - 'docs/179_OPENAPI_ADVANCED_INTELLIGENCE_READ_SURFACE.md'
      - 'docs/DOCUMENT_INDEX.md'
      - 'package.json'
      - 'scripts/verify-release.sh'
      - '.github/workflows/api-contract.yml'

  push:
    branches:
      - main
    paths:
      - 'apps/api/internal/http/**'
      - 'apps/api/internal/server/**'
      - 'openapi/**'
      - 'scripts/verify-openapi-contract.mjs'
      - 'scripts/verify-openapi-contract.test.mjs'
      - 'scripts/verify-openapi-route-inventory.mjs'
      - 'scripts/verify-openapi-route-inventory.test.mjs'
      - 'docs/175_OPENAPI_CONTRACT_FOUNDATION.md'
      - 'docs/177_OPENAPI_CONTRACT_CLOSURE_INVENTORY.md'
      - 'docs/178_OPENAPI_CORE_READ_SURFACE.md'
      - 'docs/179_OPENAPI_ADVANCED_INTELLIGENCE_READ_SURFACE.md'
      - 'docs/DOCUMENT_INDEX.md'
      - 'package.json'
      - 'scripts/verify-release.sh'
      - '.github/workflows/api-contract.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-contract:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.9.0'

      - name: Verify source-backed OpenAPI contract
        run: |
          node --test scripts/verify-openapi-route-inventory.test.mjs
          node scripts/verify-openapi-route-inventory.mjs
          node --test scripts/verify-openapi-contract.test.mjs
          node scripts/verify-openapi-contract.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('openapi/openapi.json', 'utf8'))"

      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            openapi/openapi.json
            docs/175_OPENAPI_CONTRACT_FOUNDATION.md
            docs/177_OPENAPI_CONTRACT_CLOSURE_INVENTORY.md
            docs/178_OPENAPI_CORE_READ_SURFACE.md
            docs/179_OPENAPI_ADVANCED_INTELLIGENCE_READ_SURFACE.md
          if-no-files-found: error
          retention-days: 30

# OPENAPI-CONTRACT-FOUNDATION-V1
