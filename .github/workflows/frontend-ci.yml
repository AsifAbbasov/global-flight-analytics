name: Frontend CI

on:
  pull_request:

  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/production-smoke.yml'
      - 'README.md'
      - 'docs/25_IMPLEMENTATION_SEQUENCE.md'
      - 'docs/184_STAGE_13_FRONTEND_ANALYTICS_INTEGRATION_COMPLETION.md'
      - 'docs/DOCUMENT_INDEX.md'
      - 'scripts/verify-stage-13-frontend-analytics-closure.mjs'
      - 'scripts/verify-stage-13-frontend-analytics-closure.test.mjs'
      - 'scripts/verify-release-portfolio.sh'
      - 'scripts/verify-release-portfolio.test.mjs'
      - 'scripts/verify-release.sh'
      - 'scripts/verify-dependency-maintenance.mjs'
      - 'scripts/verify-dependency-maintenance.test.mjs'
      - 'scripts/verify-frontend-dependency-security.mjs'
      - 'scripts/verify-frontend-dependency-security.test.mjs'
      - '.github/dependabot.yml'
      - 'docs/170_DEPENDENCY_MAINTENANCE_CLOSURE.md'
      - 'docs/171_DEPENDABOT_FOLLOW_UP_RECONCILIATION.md'
      - 'scripts/smoke-production-release.sh'
      - 'scripts/verify-scheduled-production-smoke.mjs'
      - 'scripts/verify-scheduled-production-smoke.test.mjs'
      - 'docs/162_RELEASE_AND_PORTFOLIO_CLOSURE.md'
      - 'docs/163_PRODUCTION_DEPLOYMENT_RUNBOOK.md'
      - 'docs/164_RECRUITER_DEMO_SCRIPT.md'
      - 'docs/165_SYSTEM_ARCHITECTURE_AND_DECISIONS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.9.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm version
        run: |
          test "$(pnpm --version)" = "11.8.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency maintenance contract
        run: |
          pnpm run test:dependency-maintenance
          pnpm run verify:dependency-maintenance

      - name: Verify release and portfolio contract
        run: |
          pnpm run test:release-contract
          pnpm run verify:release-contract

      - name: Verify Stage 13 frontend analytics closure
        run: |
          pnpm run test:stage13-frontend-analytics-closure
          pnpm run verify:stage13-frontend-analytics-closure

      - name: Verify scheduled production smoke contract
        run: |
          pnpm run test:scheduled-production-smoke
          pnpm run verify:scheduled-production-smoke

      - name: Verify dependency security policy
        run: |
          pnpm run test:web-dependency-policy
          pnpm run verify:web-dependencies

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Run ESLint
        run: pnpm --filter web lint

      - name: Run TypeScript validation
        run: pnpm --filter web typecheck

      - name: Run frontend contract tests
        run: pnpm --filter web test

      - name: Build production frontend
        run: pnpm --filter web build


  frontend-ci-gate:
    name: Frontend CI Gate
    if: ${{ always() }}
    needs:
      - frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify frontend workflow result
        shell: bash
        run: |
          test "${{ needs.frontend-quality.result }}" = "success"

