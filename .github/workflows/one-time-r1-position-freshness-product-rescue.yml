name: One-time R1 Position Freshness Product Rescue

on:
  push:
    branches:
      - feat/r1-position-freshness

permissions:
  contents: write

jobs:
  rescue:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/r1-position-freshness
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.9.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Reuse reviewed product generator steps
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/one-time-r1-position-freshness-product.yml

          extract_step() {
            local target="$1"
            awk -v target="$target" '
              $0 == "      - name: " target { found = 1; next }
              found && $0 == "        run: |" { inrun = 1; next }
              inrun && /^      - name:/ { exit }
              inrun { sub(/^          /, ""); print }
            ' "$workflow"
          }

          extract_step "Extend OpenAPI freshness contract" > /tmp/r1-openapi.sh
          extract_step "Add frontend freshness model and contracts" > /tmp/r1-frontend.sh
          test -s /tmp/r1-openapi.sh
          test -s /tmp/r1-frontend.sh
          bash /tmp/r1-openapi.sh
          bash /tmp/r1-frontend.sh

      - name: Validate R1 product slice
        shell: bash
        run: |
          set -euo pipefail
          pnpm config set minimumReleaseAge 0 --location=user
          test "$(pnpm config get minimumReleaseAge)" = "0"
          pnpm install --frozen-lockfile
          pnpm run test:openapi-contract
          pnpm run verify:openapi-contract
          pnpm run generate:openapi-client
          git diff --exit-code -- packages/api-client/src/generated.ts
          pnpm run typecheck:api-client
          pnpm run test:api-client
          pnpm --filter web lint
          pnpm --filter web typecheck
          pnpm --filter web test
          pnpm --filter web build

      - name: Commit validated R1 product slice
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-r1-position-freshness-product.yml
          rm .github/workflows/one-time-r1-position-freshness-product-rescue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: expose position freshness evidence"
          git push origin HEAD:feat/r1-position-freshness
