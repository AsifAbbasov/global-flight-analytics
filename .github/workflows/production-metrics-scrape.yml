name: Production Metrics Scrape

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-metrics-scrape
  cancel-in-progress: false

jobs:
  scrape-and-forward:
    name: Scrape and Forward Production Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      PRODUCTION_API_HOST: global-flight-analytics-api.onrender.com
      PRODUCTION_METRICS_KEY: ${{ secrets.PRODUCTION_METRICS_KEY }}
      GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
      GRAFANA_CLOUD_PROMETHEUS_QUERY_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_QUERY_URL }}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USER }}
      GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
      PRODUCTION_API_REVISION: ${{ vars.PRODUCTION_API_REVISION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate monitoring inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            PRODUCTION_METRICS_KEY \
            GRAFANA_CLOUD_PROMETHEUS_URL \
            GRAFANA_CLOUD_PROMETHEUS_QUERY_URL \
            GRAFANA_CLOUD_PROMETHEUS_USER \
            GRAFANA_CLOUD_API_KEY; do
            if [ -z "${!name:-}" ]; then
              printf '%s\n' "PRODUCTION_METRICS_INPUT=FAIL missing $name" >&2
              exit 1
            fi
          done
          if [[ ! "$PRODUCTION_API_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'PRODUCTION_METRICS_INPUT=FAIL invalid PRODUCTION_API_REVISION' >&2
            exit 1
          fi
          case "$GRAFANA_CLOUD_PROMETHEUS_URL" in
            https://*) ;;
            *) printf '%s\n' 'PRODUCTION_METRICS_INPUT=FAIL remote write URL must use HTTPS' >&2; exit 1 ;;
          esac
          case "$GRAFANA_CLOUD_PROMETHEUS_QUERY_URL" in
            https://*) ;;
            *) printf '%s\n' 'PRODUCTION_METRICS_INPUT=FAIL query URL must use HTTPS' >&2; exit 1 ;;
          esac
          printf '%s\n' 'PRODUCTION_METRICS_INPUT=PASS'

      - name: Verify protected production metrics source
        shell: bash
        run: |
          set -euo pipefail
          metrics_file="$(mktemp)"
          trap 'rm -f "$metrics_file"' EXIT
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 30 \
            --header "X-Internal-API-Key: $PRODUCTION_METRICS_KEY" \
            --output "$metrics_file" \
            "https://$PRODUCTION_API_HOST/internal/metrics"
          grep -F 'global_flight_analytics_build_info' "$metrics_file" > /dev/null
          grep -F "revision=\"$PRODUCTION_API_REVISION\"" "$metrics_file" > /dev/null
          grep -F 'global_flight_analytics_collector_last_scrape_success' "$metrics_file" > /dev/null
          printf '%s\n' 'PRODUCTION_METRICS_SOURCE_PREFLIGHT=PASS'

      - name: Validate Grafana Alloy configuration
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --env PRODUCTION_API_HOST \
            --env PRODUCTION_METRICS_KEY \
            --env GRAFANA_CLOUD_PROMETHEUS_URL \
            --env GRAFANA_CLOUD_PROMETHEUS_USER \
            --env GRAFANA_CLOUD_API_KEY \
            --env PRODUCTION_API_REVISION \
            --volume "$GITHUB_WORKSPACE/monitoring/grafana-cloud/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.18.0 \
            validate /etc/alloy/config.alloy
          printf '%s\n' 'GRAFANA_ALLOY_CONFIG=PASS'

      - name: Scrape and remote write metrics
        shell: bash
        run: |
          set -euo pipefail
          container_name="gfa-alloy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$container_name" 2>/dev/null || true
            docker rm --force "$container_name" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run \
            --detach \
            --name "$container_name" \
            --env PRODUCTION_API_HOST \
            --env PRODUCTION_METRICS_KEY \
            --env GRAFANA_CLOUD_PROMETHEUS_URL \
            --env GRAFANA_CLOUD_PROMETHEUS_USER \
            --env GRAFANA_CLOUD_API_KEY \
            --env PRODUCTION_API_REVISION \
            --volume "$GITHUB_WORKSPACE/monitoring/grafana-cloud/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.18.0 \
            run \
            --storage.path=/var/lib/alloy/data \
            /etc/alloy/config.alloy \
            > /dev/null

          sleep 100
          test "$(docker inspect --format '{{.State.Running}}' "$container_name")" = 'true'
          docker stop --time 30 "$container_name" > /dev/null
          printf '%s\n' 'GRAFANA_CLOUD_REMOTE_WRITE=PASS'

      - name: Verify Grafana Cloud query evidence
        shell: bash
        run: |
          set -euo pipefail
          query="global_flight_analytics_build_info{deployment_revision=\"$PRODUCTION_API_REVISION\"}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in $(seq 1 12); do
            curl \
              --fail \
              --silent \
              --show-error \
              --user "$GRAFANA_CLOUD_PROMETHEUS_USER:$GRAFANA_CLOUD_API_KEY" \
              --get \
              --data-urlencode "query=$query" \
              --output "$response_file" \
              "$GRAFANA_CLOUD_PROMETHEUS_QUERY_URL"

            if jq -e \
              '.status == "success" and (.data.result | type == "array") and (.data.result | length > 0)' \
              "$response_file" \
              > /dev/null; then
              printf '%s\n' 'GRAFANA_CLOUD_QUERY_EVIDENCE=PASS'
              exit 0
            fi
            sleep 10
          done

          printf '%s\n' 'GRAFANA_CLOUD_QUERY_EVIDENCE=FAIL' >&2
          cat "$response_file" >&2
          exit 1

# PRODUCTION-METRICS-SCRAPER-V1
