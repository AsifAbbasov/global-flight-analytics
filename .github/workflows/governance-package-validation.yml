name: Governance Package Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-package-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-baseline-validation:
    name: Exact Baseline Governance Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.9.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Verify toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = "11.8.0"
          node --version
          go version
          docker compose version

      - name: Normalize and identify validation runner source
        shell: bash
        run: |
          set -euo pipefail
          sed -i '810c\  assert.match(codeql, /build-mode:/);' scripts/governance-package-validation-runner.mjs
          sed -i "905c\  assert(types.has(type), 'active main rule missing: ' + type);" scripts/governance-package-validation-runner.mjs
          sed -i "908c\  assert(JSON.stringify(rules).includes(context), 'required status context missing: ' + context);" scripts/governance-package-validation-runner.mjs
          sed -i "967c\  for (const run of selected) console.log(run.name + ' run_id=' + run.id + ' conclusion=success');" scripts/governance-package-validation-runner.mjs
          sed -i "970c\  for (const run of selected) console.log(run.name + ' run_id=' + run.id + ' conclusion=' + run.conclusion);" scripts/governance-package-validation-runner.mjs
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'scripts/governance-package-validation-runner.mjs'
          let source = fs.readFileSync(file, 'utf8')
          const pattern = /function rollbackRepository\(cwd, baseline\) \{[\s\S]*?\n\}\n\nfunction applyWithRollback\(cwd, baseline, patch, validation\) \{[\s\S]*?\n\}\n\n(?=function replaceExactly)/
          const replacement = `function collectUntrackedFiles(cwd) {
            return run(
              'git',
              ['ls-files', '--others', '--exclude-standard'],
              { cwd, capture: true }
            ).split('\\n').filter(Boolean).sort();
          }

          function rollbackRepository(cwd, baseline, preservedUntracked = []) {
            run('git', ['reset', '--hard', baseline], { cwd });

            const preserved = new Set(preservedUntracked);
            for (const relative of collectUntrackedFiles(cwd)) {
              if (preserved.has(relative)) continue;
              fs.rmSync(path.join(cwd, relative), {
                recursive: true,
                force: true,
              });
            }

            const head = run(
              'git',
              ['rev-parse', 'HEAD'],
              { cwd, capture: true }
            );
            const trackedStatus = run(
              'git',
              ['diff', '--name-only'],
              { cwd, capture: true }
            );
            const actualUntracked = collectUntrackedFiles(cwd);
            const expectedUntracked = [...preserved].sort();

            if (
              head !== baseline ||
              trackedStatus !== '' ||
              JSON.stringify(actualUntracked) !== JSON.stringify(expectedUntracked)
            ) {
              throw new Error('repository rollback verification failed');
            }
          }

          function applyWithRollback(cwd, baseline, patch, validation) {
            const preservedUntracked = collectUntrackedFiles(cwd);

            try {
              patch();
              validation();
            } catch (error) {
              rollbackRepository(cwd, baseline, preservedUntracked);
              console.log('REAL_REPOSITORY_ROLLBACK=PASS');
              throw error;
            }
          }

          `
          if (!pattern.test(source)) {
            throw new Error('rollback source block was not found exactly once')
          }
          source = source.replace(pattern, replacement)
          if (pattern.test(source)) {
            throw new Error('rollback source block replacement was incomplete')
          }

          const sourceLines = source.split('\n')
          const legacyTestStart = sourceLines.findIndex(line =>
            line.includes('assert.match(releasePortfolioTests, /pull_request:')
          )
          const legacyTestEnd = sourceLines.findIndex((line, index) =>
            index >= legacyTestStart &&
            line.includes('assert.doesNotMatch(backendOperationsTests')
          )
          if (legacyTestStart < 0 || legacyTestEnd < legacyTestStart) {
            throw new Error('legacy governance test source block was not found')
          }
          sourceLines.splice(
            legacyTestStart,
            legacyTestEnd - legacyTestStart + 1,
            "  for (const migratedTestSource of [releasePortfolioTests, backendOperationsTests]) {",
            "    assert.ok(migratedTestSource.includes('const trigger ='));",
            "    assert.ok(migratedTestSource.includes('assert.match(trigger, /on:'));",
            "    assert.ok(migratedTestSource.includes('pull_request:'));",
            "    assert.ok(migratedTestSource.includes('push:/)'));",
            "  }",
            "  assert.ok(releasePortfolioTests.includes('backend.split(trackedFrontendWorkflowPath).length - 1, 1'));",
            "  assert.ok(!releasePortfolioTests.includes(']).length, 2'));",
            "  assert.ok(backendOperationsTests.includes('source.split(trackedRenderBlueprintPath).length - 1, 1'));",
            "  assert.ok(!backendOperationsTests.includes(']).length, 2'));"
          )
          source = sourceLines.join('\n')
          fs.writeFileSync(file, source)
          NODE
          node --check scripts/governance-package-validation-runner.mjs
          actual_sha="$(sha256sum scripts/governance-package-validation-runner.mjs | awk '{print $1}')"
          printf '%s\n' "VALIDATED_INSTALLER_SHA=$actual_sha"
          test "$actual_sha" = "eb49a6e8dcf5b528010c1fd0abc7bc4bf56e9c8f067ab2274e61195289c557c5"
          printf '%s\n' "VALIDATED_INSTALLER_SHA_IDENTITY=PASS sha=$actual_sha"

      - name: Validate exact installer against exact baseline
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: node scripts/governance-package-validation-runner.mjs --validate-baseline-only

      - name: Upload exact validated installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: exact-validated-governance-installer
          path: scripts/governance-package-validation-runner.mjs
          if-no-files-found: error
          retention-days: 1
