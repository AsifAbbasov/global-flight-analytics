name: Governance Package Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-package-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-baseline-validation:
    name: Exact Baseline Governance Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.9.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Verify toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = "11.8.0"
          node --version
          go version
          docker compose version

      - name: Normalize validation runner source
        shell: bash
        run: |
          set -euo pipefail
          sed -i '810c\  assert.match(codeql, /build-mode:/);' scripts/governance-package-validation-runner.mjs
          node --check scripts/governance-package-validation-runner.mjs

      - name: Validate package against exact baseline
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: node scripts/governance-package-validation-runner.mjs --validate-baseline-only
