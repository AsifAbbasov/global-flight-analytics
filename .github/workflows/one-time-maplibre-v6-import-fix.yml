name: One-time MapLibre v6 Import Fix

on:
  push:
    branches:
      - security/frontend-dependency-hotfix

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/frontend-dependency-hotfix
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.9.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply MapLibre v6 and dependency-target compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          map_path = Path('apps/web/components/map/traffic-map.tsx')
          map_text = map_path.read_text()
          before_import = "import maplibregl from 'maplibre-gl'"
          after_import = "import * as maplibregl from 'maplibre-gl'"
          if map_text.count(before_import) != 1:
              raise SystemExit('expected exactly one MapLibre default import')
          map_path.write_text(map_text.replace(before_import, after_import))

          test_path = Path('scripts/verify-dependency-maintenance.test.mjs')
          test_text = test_path.read_text()
          replacements = {
              "assert.equal(web.dependencies.next, '16.2.12');": "assert.equal(web.dependencies.next, '16.3.4');",
              "assert.equal(web.devDependencies['eslint-config-next'], '16.2.12');": "assert.equal(web.devDependencies['eslint-config-next'], '16.3.4');",
          }
          for before, after in replacements.items():
              if test_text.count(before) != 1:
                  raise SystemExit(f'expected exactly one dependency target: {before}')
              test_text = test_text.replace(before, after)
          test_path.write_text(test_text)
          PY
          git diff --check

      - name: Validate dependency hotfix with temporary install override
        shell: bash
        run: |
          set -euo pipefail
          pnpm config set minimumReleaseAge 0 --location=user
          test "$(pnpm config get minimumReleaseAge)" = "0"
          pnpm install --frozen-lockfile
          pnpm run test:dependency-maintenance
          pnpm run verify:dependency-maintenance
          pnpm run test:web-dependency-policy
          pnpm run verify:web-dependencies
          pnpm audit --prod --audit-level moderate
          pnpm --filter web lint
          pnpm --filter web typecheck
          pnpm --filter web test
          pnpm --filter web build

      - name: Commit validated compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-maplibre-v6-import-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete frontend dependency hotfix compatibility"
          git push origin HEAD:security/frontend-dependency-hotfix
