# BACKEND_OPERATIONS_EVIDENCE_CLOSURE_V1
services:
  - type: web
    name: global-flight-analytics-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: /app/server
    healthCheckPath: /api/v1/ready
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CONNECT_TIMEOUT
        value: 5s
      - key: API_PORT
        value: "10000"
      - key: API_ALLOWED_ORIGINS
        sync: false
      - key: API_BODY_LIMIT_BYTES
        value: "1048576"
      - key: API_READ_TIMEOUT
        value: 10s
      - key: API_REQUEST_TIMEOUT
        value: 12s
      - key: API_WRITE_TIMEOUT
        value: 15s
      - key: API_IDLE_TIMEOUT
        value: 60s
      - key: API_RATE_LIMIT_MAX
        value: "120"
      - key: API_RATE_LIMIT_WINDOW
        value: 1m
      - key: API_MUTATION_KEY_SHA256
        sync: false
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: MIGRATION_TIMEOUT
        value: 2m
      - key: TRAFFIC_PROVIDER
        value: airplanes.live
      - key: AIRPLANES_LIVE_TIMEOUT
        value: 10s
      - key: OPEN_METEO_TIMEOUT
        value: 10s
